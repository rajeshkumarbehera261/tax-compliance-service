<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaxGuard | Login</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="login-page">

<div class="login-background">

    <div class="login-orb orb-one"></div>
    <div class="login-orb orb-two"></div>
    <div class="login-orb orb-three"></div>

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-xl-10 col-lg-11">

                <div class="login-container">

                    <!-- LEFT -->
                    <div class="login-brand-panel">

                        <div class="brand-logo-large">
                            <i class="bi bi-shield-check"></i>
                        </div>

                        <h1>Tax<span>Guard</span></h1>

                        <p class="brand-description">
                            Intelligent Tax Compliance &
                            Gap Detection Platform
                        </p>

                        <div class="login-features">

                            <div>
                                <i class="bi bi-check-circle-fill"></i>
                                <span>Automated Tax Validation</span>
                            </div>

                            <div>
                                <i class="bi bi-check-circle-fill"></i>
                                <span>Configurable Compliance Rules</span>
                            </div>

                            <div>
                                <i class="bi bi-check-circle-fill"></i>
                                <span>Real-time Exception Detection</span>
                            </div>

                            <div>
                                <i class="bi bi-check-circle-fill"></i>
                                <span>Complete Audit Trail</span>
                            </div>

                        </div>

                    </div>

                    <!-- RIGHT -->
                    <div class="login-form-panel">

                        <div class="login-form-header">
                            <span class="welcome-label">WELCOME BACK</span>

                            <h2>Sign in</h2>

                            <p>
                                Access your compliance dashboard
                            </p>
                        </div>

                        <form id="loginForm">

                            <div class="mb-4">

                                <label class="form-label">
                                    Username
                                </label>

                                <div class="input-group custom-input">

                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>

                                    <input
                                            type="text"
                                            id="username"
                                            class="form-control"
                                            placeholder="Enter your username"
                                            required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <div class="input-group custom-input">

                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>

                                    <input
                                            type="password"
                                            id="password"
                                            class="form-control"
                                            placeholder="Enter your password"
                                            required>

                                    <button
                                            type="button"
                                            class="password-toggle"
                                            onclick="togglePassword()">

                                        <i
                                                id="passwordIcon"
                                                class="bi bi-eye">
                                        </i>

                                    </button>

                                </div>

                            </div>

                            <div
                                    id="loginError"
                                    class="alert alert-danger d-none">
                            </div>

                            <button
                                    type="submit"
                                    class="btn login-btn w-100">

                                <span id="loginText">
                                    Sign In
                                </span>

                                <span
                                        id="loginSpinner"
                                        class="spinner-border spinner-border-sm d-none">
                                </span>

                            </button>

                        </form>

                        <div class="login-footer">

                            <i class="bi bi-shield-lock"></i>

                            Secure access powered by
                            Spring Security

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
